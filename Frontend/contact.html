<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | ElderCare Companion</title><link rel="stylesheet" href="css/style.css">
</head>
<body><div id="site-header"></div>
<main><section class="page-banner"><div class="container"><span class="eyebrow">CONTACT</span><h1>We would love to hear from you</h1><p>Send feedback, suggestions or questions about the project.</p></div></section>
<section class="section"><div class="container two-col">
<div class="info-card"><h2>Project contact</h2><p>Use this form for feedback about usability, features or improvements.</p><div class="contact-detail">✉ support@eldercare.local</div><div class="contact-detail">📞 +91 00000 00000</div><div class="contact-detail">📍 Student Project • CMR University</div></div>
<form class="form-card" id="contactForm"><h2>Send a message</h2><label>Name<input id="contactName" required></label><label>Email<input id="contactEmail" type="email" required></label><label>Message<textarea id="contactMessage" rows="5" required></textarea></label><button class="btn btn-primary" type="submit">Send Message</button><div id="contactStatus" class="form-status"></div></form>
</div></section></main><div id="site-footer"></div><script src="js/app.js"></script></body></html>
