<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Medicines | ElderCare Companion</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div>
<main><section class="page-banner"><div class="container"><span class="eyebrow">MEDICINE REMINDER</span><h1>Manage medicines</h1><p>Keep daily medicine information organized.</p></div></section>
<section class="section"><div class="container two-col module-layout">
<form class="form-card" id="medicineForm"><h2>Add medicine</h2><label>Medicine name<input id="medName" required></label><label>Dosage<input id="medDosage" placeholder="e.g. 500 mg" required></label><label>Time<input id="medTime" type="time" required></label><label>Frequency<select id="medFrequency"><option>Daily</option><option>Twice daily</option><option>Weekly</option><option>As needed</option></select></label><button class="btn btn-primary" type="submit">Add Medicine</button></form>
<div><div class="module-top"><h2>My medicines</h2><span id="medicineEmpty" class="muted">No medicines added yet.</span></div><div id="medicineList" class="item-list"></div></div>
</div></section></main><div id="site-footer"></div><script src="js/app.js"></script></body></html>
